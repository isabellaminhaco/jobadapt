    <!-- JavaScript Lógico Puro e Blindado contra Bloqueios de Rede -->
    <script>
        async function chamarGemini(prompt, apiKey) {
            // URL oficial da API do Google que aceita requisições diretas de navegadores
            const url = "https://googleapis.com" + apiKey;
            
            // Estrutura de dados simplificada e nativa aceita pela Google
            const corpo = {
                contents: [{
                    parts: [{ text: prompt }]
                }]
            };

            const response = await fetch(url, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(corpo)
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "Falha na comunicação com o servidor.");
            }

            const data = await response.json();
            
            // Caminho exato de leitura da resposta da árvore do JSON da Google
            if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
                return data.candidates[0].content.parts[0].text;
            }
            throw new Error("Formato de resposta inesperado da inteligência artificial.");
        }

        async function processarAnalise() {
            const curr = document.getElementById('curriculo').value.trim();
            const vaga = document.getElementById('vaga').value.trim();
            const keyGemini = document.getElementById('key-gemini').value.trim();

            if (!curr || !vaga) { alert("Por favor, preencha o seu currículo base e os requisitos da vaga!"); return; }
            if (!keyGemini) { alert("A API Key precisa estar configurada!"); return; }

            const btn = document.getElementById('btn-main');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ <span class="animate-pulse tracking-widest text-[11px]">Calculando Score...</span>';
            btn.disabled = true;

            const promptScore = "Você é um Recrutador Sênior especialista em softwares de RH (ATS). Analise a aderência entre o currículo e a vaga informados. Você DEVE retornar UNICAMENTE um objeto JSON válido estruturado exatamente no modelo abaixo, sem markdown (sem ```json ou ```), sem textos explicativos fora do objeto:\n{\n\"score\": 85,\n\"palavras_faltantes\": [\"Cash Management\", \"Liquidação\", \"Jira\"],\n\"sugestao_melhoria\": \"Ajuste as conquistas para destacar o gerenciamento de roadmaps.\"\n}\n\nCURRÍCULO:\n" + curr + "\n\nVAGA:\n" + vaga;

            try {
                const responseText = await chamarGemini(promptScore, keyGemini);
                const jsonClean = responseText.replace(/```json/g, "").replace(/```/g, "").trim();
                const dados = JSON.parse(jsonClean);

                const score = parseInt(dados.score) || 0;
                document.getElementById('num-score').innerText = score;
                document.getElementById('sugestao-ia').innerText = dados.sugestao_melhoria;

                const badge = document.getElementById('score-badge');
                const label = document.getElementById('texto-classificacao');

                badge.className = "text-5xl font-black px-6 py-4 rounded-2xl border bg-gray-950 flex items-center justify-center font-mono tracking-tighter ";
                label.className = "text-[10px] font-extrabold uppercase tracking-widest px-3 py-1 rounded-full border ";

                if (score <= 30) {
                    label.innerText = "🚨 RUIM (Aderência Crítica)";
                    label.classList.add("bg-red-950/60", "text-red-400", "border-red-900/40");
                    badge.classList.add("text-red-400", "border-red-500/20");
                } else if (score <= 50) {
                    label.innerText = "⚠️ MEDIANO (Ajustes Necessários)";
                    label.classList.add("bg-amber-950/60", "text-amber-400", "border-amber-900/40");
                    badge.classList.add("text-amber-400", "border-amber-500/20");
                } else if (score <= 70) {
                    label.innerText = "📈 BOM (Perfil Competitivo)";
                    label.classList.add("bg-blue-950/60", "text-blue-400", "border-blue-900/40");
                    badge.classList.add("text-blue-400", "border-blue-500/20");
                } else {
                    label.innerText = "🔥 EXCELENTE MATCH (Pronto para o RH)";
                    label.classList.add("bg-emerald-950/60", "text-emerald-400", "border-emerald-900/40");
                    badge.classList.add("text-emerald-400", "border-emerald-500/20");
                }

                const tagsContainer = document.getElementById('tags-faltantes');
                tagsContainer.innerHTML = '';
                if (!dados.palavras_faltantes || dados.palavras_faltantes.length === 0) {
                    tagsContainer.innerHTML = '<span class="text-xs text-emerald-400 bg-emerald-950/30 border border-emerald-900/20 px-2 py-1 rounded-lg">Perfil 100% alinhado!</span>';
                } else {
                    dados.palavras_faltantes.forEach(tag => {
                        tagsContainer.innerHTML += `<span class="text-xs text-red-400 bg-red-950/20 border border-red-900/30 px-2.5 py-1 rounded-lg font-medium">${tag}</span>`;
                    });
                }

                document.getElementById('painel-diagnostico').classList.remove('hidden');
                document.getElementById('painel-diagnostico').scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                alert("Falha no diagnóstico: " + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        async function otimizarCurriculo() {
            const curr = document.getElementById('curriculo').value.trim();
            const vaga = document.getElementById('vaga').value.trim();
            const keyGemini = document.getElementById('key-gemini').value.trim();

            if (!curr || !vaga) { alert("Por favor, preencha o seu currículo base e os requisitos da vaga!"); return; }
            if (!keyGemini) { alert("A API Key precisa estar configurada!"); return; }

            const btn = document.getElementById('btn-optimize');
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ <span class="animate-pulse tracking-wider">Construindo Currículo ATS...</span>';
            btn.disabled = true;

            const promptOptimize = "Você é um Recrutador Sênior especialista em softwares de recrutamento (ATS). Reescreva o currículo fornecido abaixo adaptando-o para as exigências da vaga. DIRETRIZES OBRIGATÓRIAS DE CONTEÚDO (MANDATÓRIAS):\n1. Você DEVE manter TODAS as empresas, períodos de trabalho e métricas detalhadas originais (como os R$ 2 bilhões, redução de SLA de 20 para 7 dias, 5 clientes piloto, etc.). Proibido resumir ou truncar o histórico.\n2. Estrutura 100% vertical e limpa: Nome da Empresa, Cargo e Período dispostos em linhas distintas.\n3. Responsabilidades descritas em tópicos curtos (bullet points), iniciando estritamente com um hífen simples e um espaço (exemplo: \"- Liderou o redesenho contábil...\").\n4. Não use caracteres especiais como asteriscos (*), barras decorativas ou linhas extensas de hífens.\n5. Retorne EXCLUSIVAMENTE o texto puro do currículo otimizado de ponta a ponta, sem saudações ou explicações textuais adicionais fora do documento.\n\nCURRÍCULO BASE:\n" + curr + "\n\nVAGA ALVO:\n" + vaga;

            try {
                const responseText = await chamarGemini(promptOptimize, keyGemini);
                document.getElementById('resultado-texto-ats').innerText = responseText.trim();
                document.getElementById('bloco-curriculo-ats').classList.remove('hidden');
                document.getElementById('bloco-btn-pdf').classList.remove('hidden');
                document.getElementById('bloco-curriculo-ats').scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                alert("Erro ao reestruturar dados: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        function copiarTextoOtimizado() {
            const txt = document.getElementById('resultado-texto-ats').innerText;
            navigator.clipboard.writeText(txt);
            alert("📋 Texto copiado com sucesso para a área de transferência!");
        }

        function baixarCurriculoPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: "p", unit: "mm", format: "a4" });
            const txt = document.getElementById('resultado-texto-ats').innerText;
            
            doc.setFont("Helvetica", "normal");
            doc.setFontSize(10);
            
            const xMargem = 15;
            let yPos = 15;
            const larguraMax = 180;
            const alturaMaxJanela = 270;

            const linhas = txt.split("\n");
            
            linhas.forEach(linha => {
                const linhaLimpa = linha.trim();
                
                if (!linhaLimpa) {
                    yPos += 3;
                    return;
                }

                const linhasDivididas = doc.splitTextToSize(linhaLimpa, larguraMax);
                
                linhasDivididas.forEach(l => {
                    if (yPos > alturaMaxJanela) {
                        doc.addPage();
                        yPos = 15;
                    }
                    doc.text(l, xMargem, yPos);
                    yPos += 5.5;
                });
            });

            doc.save("Curriculo_Isabella_Otimizado_ATS.pdf");
        }
    </script>
</body>
</html>
